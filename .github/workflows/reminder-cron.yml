name: Hourly Reminder Dispatch

on:
  schedule:
    # Runs every hour at minute 0
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder cron endpoint
        run: |
          APP_URL="${{ secrets.APP_URL }}"
          if [ -z "$APP_URL" ]; then
            APP_URL="https://bubbleso2-aio.vercel.app"
          fi
          echo "Triggering reminder cron at: ${APP_URL}/api/cron/reminders"
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${APP_URL}/api/cron/reminders"
